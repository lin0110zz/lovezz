<!-- 别拷打我的代码了  球球了 TVT  你看完也只能收获一坨 -->
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>love you ♡</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        overflow: hidden;
        overflow-x: hidden;
        overflow-y: hidden;
        overscroll-behavior: none;
        overscroll-behavior-x: none;
        overscroll-behavior-y: none;
      }
      body {
        min-height: 100dvh;
        font-family: "Microoft "Microsoft YaHei ", "PingFang SC", sans-serif;
        overflow: hidden;
        background: radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.8), transparent 25%),
        radial-gradient(circle at 80% 30%, rgba(255, 220, 235, 0.8), transparent 30%),
        linear-gradient(135deg, #ffe6ee, #fff4f7, #ffdce9);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }

      /*页面*/
      .page{
        position: absolute;
        width: 100%;
        height: 100dvh;
        overflow-x: hidden;
        overflow-y: hidden;
        display: none;
        align-items: center;
        justify-content: center;
      }

      /*当前显示页面*/
      .page.active{
        display: flex !important;
        opacity: 1 !important;
        visibility: visible;!important;
        pointer-events: auto;!important;
        position: relative;!important;
        z-index: 9999 !important;
        height: 100dvh !important;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
      }

      /* 第一页 */
      .capsule{
        width: 88%;
        max-width: 420px;
        padding: 55px 30px;
        text-align: center;
        background: rgba(255,255,255,0.75);
        border-radius: 32px;
        box-shadow: 0 20px 60px rgba(220,120,160,0.18);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.8);
        margin: auto;
      }

      .small-heart {
        font-size: 45px;
        margin-bottom: 20px;
        animation: heartbeat 2s infinite;
        white-space: nowrap;
      }
      @keyframes heartbeat {
        0%,100%{
          transform: scale(1);
        }
        50%{
          transform: scale(1.12);
        }
      }

      .capsule h1{
        font-size: 26px;
        color: #d86f98;
        margin-bottom: 20px;
        font-weight: 500;
      }

      .capsule p{
        font-size: 15px;
        color: #9b7180;
        line-height: 2;
        margin-bottom: 35px;
      }

      .open-button{
        border: none;
        padding: 15px 38px;
        border-radius: 50px;
        font-size: 16px;
        cursor: pointer;
        color: white;
        background: linear-gradient(135deg,#f6a6bd,#e889a8);
        box-shadow: 0 8px 20px rgba(225,120,155,0.35);
        transition: 0.3s;
      }

      .open-button:hover{
        transform: translateY(-3px)scale(0.97);
      }

      /*第二页*/

      .memory-card{
        width: 88%;
        max-width: 430px;
        padding:40px 28px;
        text-align: center;
        background: rgba(255,255,255,0.82);
        border-radius: 30px;
        box-shadow: 0 25px 70px rgba(220,120,160,0.2);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255,255,255,0.9);
        margin: auto;
        overflow-x: hidden;
        overflow-y: hidden;
      }

      .top-decoration{
        font-size: 30px;
        margin-bottom: 20px;
      }

      .memory-card h2{
        color: #d86f98;
        font-size: 24px;
        font-weight: 500;
        margin-bottom: 15px;
      }

      .memory-text{
        color: #a27b89;
        font-size: 14px;
        line-height: 2;
        margin-bottom: 35px;
      }

      /*歌曲名称*/
      .song-name{
        text-align: center;
        color: #d86f98;
        font-size: 17px;
        font-weight: 600;
        margin: 0 auto 14px;
        letter-spacing: 1.5px;
        opacity: 0.92;
        transition: opacity 0.3s ease;
      }
      .song-name::before{
        content: "♡ ";
        font-size: 14px;
        color: #e89ab3;
      }

      /*唱片*/
      .record-wrapper{
        width: 170px;
        height: 170px;
        margin: 0 auto 35px;
        position: relative;
        cursor: grab;
        transition: transform 0.3s ease;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        -webkit-touch-callout: none;
      }
      .record-wrapper:active{
        cursor: grabbing;
      }
      .record{
        width: 170px;
        height: 170px;
        margin: 0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        background: repeating-radial-gradient(
        circle,#e89ab3 0px,#e89ab3 3px,#df88a6 4px,#df88a6 7px
        );
        box-shadow: 0 10px 30px rgba(200,100,140,0.25);
      }

      .record::before{
        content: "";
        width: 62px;
        height: 62px;
        border-radius: 50%;
        background: linear-gradient(135deg,#ffe8d5,#f7aec4);
        position: absolute;
      }

      .record::after{
        content: "♡";
        position: absolute;
        font-size: 24px;
        color: white;
        z-index: 2;
      }

      .spinning{
        animation: spin 6s linear infinite;
      }
      @keyframes spin {
        from {
          transform: rotate(360deg);
        }
      }

      /*播放按钮*/
      .play-button{
        width: 72px;
        height: 72px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        font-size: 28px;
        color: white;
        background: linear-gradient(135deg,#f5a1bb,#e77f9f);
        box-shadow: 0 10px 25px rgba(220,100,145,0.35);
        transition: 0.3s;
        margin-bottom: 28px;
      }

      .play-button:hover{
        transform: scale(1.08);
      }

      .play-button:active{
        transform: scale(0.94);
      }

      /*进度条*/
      .progress-container{
        width: 100%;
        height: 6px;
        border-radius: 10px;
        background: #f7d6e0;
        cursor: pointer;
        overflow: hidden;
        margin-bottom: 14px;
      }

      .progress{
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg,#f3a0b9,#df7f9f);
        border-radius: 10px;
      }


      /*时间*/
      .time{
        display: flex;
        justify-content: space-between;
        color: #b48796;
        font-size: 12px;
      }

      .date{
        margin-top: 30px;
        font-size: 12px;
        color: #c59aa9;
      }

      /*NFC写入按钮*/
      .nfc-button{
        margin-top: 18px;
        border: none;
        padding: 11px 28px;
        border-radius: 50px;
        font-size: 13px;
        cursor: pointer;
        color: white;
        background: linear-gradient(135deg,#f6a6bd,#e889a8);
        box-shadow: 0 6px 16px rgba(225,120,155,0.3);
        transition: 0.3s;
      }
      .nfc-button:hover{
        transform: translateY(-2px);
      }
      .nfc-button:active{
        transform: scale(0.96);
      }

      /*漂浮元素*/
      .floating{
        position: absolute;
        color: rgba(255,150,185,0.35);
        animation: float 12s ease-in-out infinite;
        pointer-events: none;
      }

      .f1{ top: 6%; left: 8%; font-size: 34px; animation-delay: 0s; }
      .f2{ top: 12%; right: 10%; font-size: 26px; animation-delay: 1.5s; }
      .f3{ top: 22%; left: 4%; font-size: 23px; animation-delay: 3s; }
      .f4{ top: 18%; right: 28%; font-size: 31px; animation-delay: 0.8s; }
      .f5{ top: 35%; left: 14%; font-size: 29px; animation-delay: 2.2s; }
      .f6{ top: 40%; right: 6%; font-size: 36px; animation-delay: 4s; }
      .f7{ top: 50%; left: 28%; font-size: 21px; animation-delay: 1s; }
      .f8{ top: 55%; right: 18%; font-size: 26px; animation-delay: 3.5s; }
      .f9{ top: 65%; left: 8%; font-size: 39px; animation-delay: 0.5s; }
      .f10{ top: 70%; right: 12%; font-size: 31px; animation-delay: 2.8s; }
      .f11{ top: 4%; left: 42%; font-size: 23px; animation-delay: 5s; }
      .f12{ top: 30%; left: 48%; font-size: 26px; animation-delay: 1.8s; }
      .f13{ top: 78%; left: 40%; font-size: 29px; animation-delay: 4.2s; }
      .f14{ top: 60%; right: 35%; font-size: 21px; animation-delay: 0.3s; }
      .f15{ bottom: 6%; left: 22%; font-size: 34px; animation-delay: 3.2s; }
      .f16{ top: 8%; right: 42%; font-size: 26px; animation-delay: 2.5s; }

      @keyframes float {
        0%,100%{
          transform: translateY(0px) rotate(0deg);
        }
        50%{
          transform: translateY(-22px) rotate(8deg);
        }
      }

      /*IP装饰（呆猫八条）*/
      .ip-deco{
        position: absolute;
        z-index: -1;
        pointer-events: none;
        animation: float 9s ease-in-out infinite;
        opacity: 0.96;
      }
      .ip-deco img{
        width: 100%;
        height: auto;
        display: block;
        filter: drop-shadow(0 6px 12px rgba(220,120,160,0.28));
      }
      .ipd1{ top: 6%; right: 5%; width: 78px; animation-delay: 0.6s; }
      .ipd1 img{ transform: rotate(10deg); }
      .ipd2{ bottom: 8%; left: 5%; width: 92px; animation-delay: 2.2s; }
      .ipd2 img{ transform: rotate(-7deg); }
      .ipd3{ top: 3%; right: 5%; width: 72px; animation-delay: 1.4s; }
      .ipd3 img{ transform: rotate(12deg); }
      .ipd4{ bottom: 9%; left: 5%; width: 84px; animation-delay: 3s; }
      .ipd4 img{ transform: rotate(-9deg); }
      .ipd5{ top: 16%; left: 2%; width: 62px; animation-delay: 3.8s; }
      .ipd5 img{ transform: rotate(-14deg); }

      @media (max-width: 430px) {
        .ipd1{ width: 60px; }
        .ipd2{ width: 72px; }
        .ipd3{ width: 56px; }
        .ipd4{ width: 66px; }
        .ipd5{ width: 46px; }
      }

      /*移动端适配*/
      @media (max-width: 430px) {
        .capsule{
          padding: 36px 20px;
        }
        .capsule h1{
          font-size: 22px;
          margin-bottom: 14px;
        }
        .capsule p{
          font-size: 14px;
          line-height: 1.9;
          margin-bottom: 24px;
        }
        .open-button{
          padding: 13px 34px;
          font-size: 15px;
        }
        .small-heart{
          font-size: 30px;
          margin-bottom: 12px;
        }

        .memory-card{
          padding: 26px 18px;
        }
        .memory-card h2{
          font-size: 20px;
          margin-bottom: 10px;
        }
        .memory-text{
          font-size: 13px;
          margin-bottom: 22px;
        }
        .record{
          width: 130px;
          height: 130px;
        }
        .record-wrapper{
          width: 130px;
          height: 130px;
          margin: 0 auto 22px;
        }
        .record::before{
          width: 48px;
          height: 48px;
        }
        .song-name{
          font-size: 14px;
          margin-bottom: 10px;
          letter-spacing: 1px;
        }
        .play-button{
          width: 60px;
          height: 60px;
          font-size: 24px;
          margin-bottom: 18px;
        }
        .progress-container{
          height: 5px;
          margin-bottom: 10px;
        }
        .time{
          font-size: 11px;
        }
        .date{
          margin-top: 18px;
        }
        .nfc-button{
          margin-top: 12px;
        }
        .playlist-bar{
          padding: 6px 14px;
          font-size: 12px;
          gap: 6px;
        }
        .playlist-content{
          max-height: 75vh;
        }
        .mode-btn .mode-icon{
          font-size: 16px;
        }
        .mode-btn .mode-text{
          font-size: 10px;
        }
      }

      /*播放列表入口栏*/
      .playlist-bar{
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin: 0 auto 14px;
        padding: 8px 18px;
        background: rgba(255, 235, 240, 0.7);
        border-radius: 20px;
        font-size: 13px;
        color: #c59aa9;
        cursor: pointer;
        transition: all 0.2s ease;
        width: fit-content;
        user-select: none;
      }
      .playlist-bar:hover{
        background: rgba(255, 220, 230, 0.9);
        color: #d86f98;
      }
      .playlist-bar-icon{
        font-size: 15px;
      }
      .playlist-bar-title{
        font-weight: 600;
        color: #d86f98;
      }
      .playlist-bar-count{
        color: #b48796;
        font-size: 12px;
      }
      .playlist-bar-mode{
        padding: 2px 8px;
        background: #f7aec4;
        color: white;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 600;
      }

      /*播放列表面板*/
      .playlist-panel{
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1000;
        display: none;
      }
      .playlist-panel.show{
        display: block;
      }
      .playlist-mask{
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
      }
      .playlist-content{
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        max-height: 70vh;
        background: #fff5f7;
        border-radius: 20px 20px 0 0;
        display: flex;
        flex-direction: column;
        animation: slideUp 0.3s ease;
      }
      @keyframes slideUp{
        from{ transform: translateY(100%); }
        to{ transform: translateY(0); }
      }
      .playlist-header{
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px 12px;
        border-bottom: 1px solid #ffe0e8;
      }
      .playlist-title{
        font-size: 17px;
        font-weight: 700;
        color: #d86f98;
      }
      .playlist-close{
        font-size: 18px;
        color: #c59aa9;
        cursor: pointer;
        padding: 4px 8px;
      }
      .playlist-modes{
        display: flex;
        gap: 8px;
        padding: 12px 20px;
        border-bottom: 1px solid #ffe0e8;
      }
      .mode-btn{
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 8px 4px;
        border: none;
        background: transparent;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .mode-btn .mode-icon{
        font-size: 18px;
      }
      .mode-btn .mode-text{
        font-size: 11px;
        color: #b48796;
      }
      .mode-btn.active{
        background: #f7aec4;
      }
      .mode-btn.active .mode-text{
        color: white;
        font-weight: 600;
      }
      .playlist-items{
        flex: 1;
        overflow-y: auto;
        padding: 8px 0;
      }
      .playlist-item{
        display: flex;
        align-items: center;
        padding: 12px 20px;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .playlist-item:hover{
        background: rgba(247, 174, 196, 0.15);
      }
      .playlist-item.playing{
        background: rgba(247, 174, 196, 0.2);
      }
      .playlist-item.playing .item-index{
        color: #d86f98;
        font-weight: 700;
      }
      .playlist-item.playing .item-name{
        color: #d86f98;
        font-weight: 600;
      }
      .item-index{
        width: 28px;
        font-size: 14px;
        color: #c59aa9;
        text-align: center;
      }
      .item-name{
        flex: 1;
        font-size: 14px;
        color: #7a5c68;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .item-remove{
        font-size: 14px;
        color: #d4b5c0;
        padding: 4px 10px;
        cursor: pointer;
        transition: color 0.15s;
      }
      .item-remove:hover{
        color: #d86f98;
      }
      .playlist-footer{
        padding: 12px 20px 16px;
        border-top: 1px solid #ffe0e8;
      }
      .add-song-btn{
        width: 100%;
        padding: 10px;
        border: 1px dashed #f7aec4;
        background: transparent;
        color: #d86f98;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }
      .add-song-btn:hover{
        background: rgba(247, 174, 196, 0.1);
      }

      /*添加歌曲弹窗*/
      .add-song-modal{
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1100;
        display: none;
        align-items: center;
        justify-content: center;
      }
      .add-song-modal.show{
        display: flex;
      }
      .add-song-mask{
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
      }
      .add-song-content{
        position: relative;
        width: 85%;
        max-width: 360px;
        max-height: 60vh;
        background: #fff5f7;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        animation: popIn 0.25s ease;
      }
      @keyframes popIn{
        from{ transform: scale(0.9); opacity: 0; }
        to{ transform: scale(1); opacity: 1; }
      }
      .add-song-header{
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 18px;
        border-bottom: 1px solid #ffe0e8;
        font-size: 16px;
        font-weight: 700;
        color: #d86f98;
      }
      .add-song-close{
        font-size: 16px;
        color: #c59aa9;
        cursor: pointer;
        padding: 4px 8px;
      }
      .add-song-list{
        flex: 1;
        overflow-y: auto;
        padding: 8px 0;
      }
      .add-song-item{
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 18px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .add-song-item:hover{
        background: rgba(247, 174, 196, 0.15);
      }
      .add-song-item.disabled{
        opacity: 0.4;
        cursor: not-allowed;
      }
      .add-item-name{
        font-size: 14px;
        color: #7a5c68;
      }
      .add-item-status{
        font-size: 12px;
        color: #d86f98;
        font-weight: 600;
      }
      .add-song-item.disabled .add-item-status{
        color: #c59aa9;
      }

      /*========== 搜索功能 ==========*/
      /*播放列表栏里的搜索输入框*/
      .search-bar-input{
        display: inline-flex;
        align-items: center;
        height: 32px;
        padding: 0 14px;
        border-radius: 50px;
        background: rgba(255,255,255,0.7);
        border: 1px solid rgba(247,174,196,0.4);
        cursor: pointer;
        transition: 0.25s;
        margin-left: 8px;
        gap: 6px;
        flex-shrink: 0;
      }
      .search-bar-input:hover{
        background: white;
        border-color: #f6a6bd;
        box-shadow: 0 2px 8px rgba(225,120,155,0.2);
      }
      .search-bar-icon{
        font-size: 12px;
        color: #d86f98;
      }
      .search-bar-placeholder{
        font-size: 12px;
        color: #b08a98;
        white-space: nowrap;
      }

      /*搜索弹窗遮罩*/
      .search-modal-mask{
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.4);
        z-index: 2000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s, visibility 0.3s;
      }
      .search-modal-mask.show{
        opacity: 1;
        visibility: visible;
      }

      /*搜索弹窗*/
      .search-modal{
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.9);
        width: 90%;
        max-width: 420px;
        max-height: 80vh;
        background: linear-gradient(180deg, #fff8fa, #fff0f5);
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(220,120,160,0.3);
        z-index: 2001;
        display: flex;
        flex-direction: column;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s, visibility 0s linear 0.35s;
        overflow: hidden;
      }
      .search-modal.show{
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s, visibility 0s linear 0s;
      }
      .search-modal-header{
        display: flex;
        align-items: center;
        padding: 14px 14px 10px;
        gap: 8px;
        flex-shrink: 0;
      }
      .search-modal-input-wrap{
        flex: 1;
        position: relative;
        min-width: 0;
      }
      .search-modal-close{
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: rgba(247,174,196,0.15);
        color: #c59aa9;
        font-size: 14px;
        cursor: pointer;
        transition: 0.2s;
        flex-shrink: 0;
      }
      .search-modal-close:hover{
        background: rgba(247,174,196,0.3);
        color: #d86f98;
      }

    <!--IP装饰：呆猫八条-->
    <div class="ip-deco ipd3"><img src="batiao_shejiao.png" alt="呆猫八条"></div>
    <div class="ip-deco ipd4"><img src="batiao_xingxing.png" alt="呆猫八条"></div>
    <div class="ip-deco ipd5"><img src="batiao_xingxing.png" alt="呆猫八条"></div>

  </div>

  <!--音频-->
  <audio
    id="audio" src="voice1.mp3" preload="auto" playsinline>
  </audio>

  <script>
    const audio = document .getElementById("audio");
    const playButton=document .getElementById("playButton");
    const record=document .getElementById("record");
    const progress=document .getElementById("progress");
    const progressContainer=document .getElementById("progressContainer");
    const currenTime=document .getElementById("currentTime");
    const duration=document.getElementById("duration");
    const songName=document.getElementById("songName");

    /*唱片滑动切音频*/
    const recordWrapper = document.getElementById("recordWrapper");
    /*所有歌曲库*/
    const allSongs = [
      {src: "voice1.mp3", name: "记得想我"},
      {src: "voice2.mp3", name: "我爱你"},
      {src: "voice.mp3", name: "几分之几"},
      {src: "voice3.mp3", name: "爱，很简单"},
      {src: "voice4.mp3", name: "我不难过"}
    ];
    /*播放列表（存储 allSongs 的索引，默认全部）*/
    let playlist = [0, 1, 2, 3, 4];
    /*播放模式: order顺序 / repeat-list列表循环 / repeat-one单曲 / shuffle随机*/
    let playMode = "order";
    /*当前播放列表中的位置*/
    let currentPlaylistIndex = 0;
    /*用户是否手动暂停（区分后台自动暂停）*/
    let isUserPaused = false;
    /*是否正在切歌（防止 timeupdate 和 ended 重复触发）*/
    let isSwitching = false;
    let swipeStartX = 0;
    let swipeCurrentX = 0;
    let isSwiping = false;
    const SWIPE_THRESHOLD = 60;
    let maxSwipeDistance = 80;

    function calcSwipeBoundary() {
      var card = document.querySelector(".memory-card");
      var wrapper = document.getElementById("recordWrapper");
      if (!card || !wrapper) return 80;
      var cardRect = card.getBoundingClientRect();
      var wrapperRect = wrapper.getBoundingClientRect();
      var maxDist = (cardRect.width - wrapperRect.width) / 2;
      return Math.max(20, maxDist);
    }

    function getSwipeX(e) {
      return e.touches ? e.touches[0].clientX : e.clientX;
    }

    function getCurrentSong() {
      return allSongs[playlist[currentPlaylistIndex]];
    }

    function switchAudio(pIndex) {
      if (playlist.length === 0) return;
      if (isSwitching) return;
      isSwitching = true;
      setTimeout(function(){ isSwitching = false; }, 800);
      if (pIndex < 0) pIndex = playlist.length - 1;
      if (pIndex >= playlist.length) pIndex = 0;
      currentPlaylistIndex = pIndex;
      const song = getCurrentSong();
      /*不先 pause，直接换 src 保持移动端后台播放会话连续*/
      audio.src = song.src;
      audio.play().catch(function(){});
      playButton.innerHTML = "Ⅱ";
      record.classList.add("spinning");
      progress.style.width = "0%";
      currenTime.innerHTML = "0:00";
      songName.style.opacity = "0";
      setTimeout(function(){
        songName.innerHTML = song.name;
        songName.style.opacity = "0.92";
      }, 200);
      renderPlaylist();
      // 刷新歌单详情页的播放状态
      if (currentSearchTab === "playlists" && currentDetailPlaylistId) {
        renderPlaylistDetail(currentDetailPlaylistId);
      }
    }

    function handleSwipeEnd(deltaX) {
      recordWrapper.style.transition = "transform 0.3s ease";
      if (Math.abs(deltaX) < SWIPE_THRESHOLD) {
        recordWrapper.style.transform = "translateX(0)";
        return;
      }
      if (playlist.length === 0) {
        recordWrapper.style.transform = "translateX(0)";
        return;
      }
      if (deltaX < 0) {
        switchAudio(currentPlaylistIndex + 1);
      } else {
        switchAudio(currentPlaylistIndex - 1);
      }
      recordWrapper.style.transform = "translateX(0)";
    }

    recordWrapper.addEventListener("touchstart", function(e) {
      swipeStartX = getSwipeX(e);
      isSwiping = true;
      maxSwipeDistance = calcSwipeBoundary();
      recordWrapper.style.transition = "none";
    }, { passive: true });
    recordWrapper.addEventListener("touchmove", function(e) {
      if (!isSwiping) return;
      e.preventDefault();
      var delta = getSwipeX(e) - swipeStartX;
      swipeCurrentX = Math.max(-maxSwipeDistance, Math.min(maxSwipeDistance, delta));
      recordWrapper.style.transform = "translateX(" + swipeCurrentX + "px)";
    }, { passive: false });
    recordWrapper.addEventListener("touchend", function() {
      if (!isSwiping) return;
      isSwiping = false;
      handleSwipeEnd(swipeCurrentX);
      swipeCurrentX = 0;
    });

    recordWrapper.addEventListener("mousedown", function(e) {
      swipeStartX = getSwipeX(e);
      isSwiping = true;
      maxSwipeDistance = calcSwipeBoundary();
      recordWrapper.style.transition = "none";
      e.preventDefault();
    });
    document.addEventListener("mousemove", function(e) {
      if (!isSwiping) return;
      var delta = getSwipeX(e) - swipeStartX;
      swipeCurrentX = Math.max(-maxSwipeDistance, Math.min(maxSwipeDistance, delta));
      recordWrapper.style.transform = "translateX(" + swipeCurrentX + "px)";
    });
    document.addEventListener("mouseup", function() {
      if (!isSwiping) return;
      isSwiping = false;
      handleSwipeEnd(swipeCurrentX);
      swipeCurrentX = 0;
    });

    /*打开纪念页面*/
    function  openMemory(){
      document .getElementById("page1") .classList .remove("active");
      document .getElementById("page2") .classList .add("active");
    }

    /*播放 暂停*/

    playButton .addEventListener("click",()=> {
      if (
              audio.paused
      ) {
        audio.play();
        isUserPaused = false;
        playButton.innerHTML = "Ⅱ";
        record.classList.add("spinning");
      } else {
        audio.pause();
        isUserPaused = true;
        playButton.innerHTML = "qwq";
        record.classList.remove("spinning");
      }
    }
    );

    /*更新进度*/
    audio.addEventListener("timeupdate",
            ()=>{
      const percentage = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      progress.style.width = percentage + "%";
      currenTime .innerHTML=formatTime(
              audio.currentTime
      );
      /*备用切歌：息屏后台时 ended 可能不触发，接近结尾时手动切歌*/
      if (!isUserPaused && !isSwitching && audio.duration && audio.currentTime >= audio.duration - 0.5) {
        handleAutoNext();
      }
            }
    );

/*音频总长度*/
    audio.addEventListener("loadedmetadata",()=>{
      duration.innerHTML=formatTime(
              audio.duration
      );
    }
    )
    /*点击进度条跳转*/
    progressContainer.addEventListener(
            "click",(e)=>{
              const width=progressContainer.clientWidth;
              const clickX=e.offsetX;
              audio.currentTime=(
                      clickX/width
              )
              * audio.duration;
            }
    );

    /*自动播放下一首（供 ended 和 timeupdate 共同调用，解决息屏后台 ended 不触发的问题）*/
    function handleAutoNext() {
      if (isUserPaused || isSwitching) return;
      if (playlist.length === 0) {
        playButton.innerHTML="qwq";
        record.classList.remove("spinning");
        return;
      }
      if (playMode === "repeat-one") {
        audio.currentTime = 0;
        audio.play();
        return;
      }
      if (playMode === "shuffle") {
        if (playlist.length <= 1) {
          audio.currentTime = 0;
          audio.play();
          return;
        }
        let next;
        do {
          next = Math.floor(Math.random() * playlist.length);
        } while (next === currentPlaylistIndex);
        switchAudio(next);
        return;
      }
      /*顺序播放 / 列表循环*/
      if (currentPlaylistIndex < playlist.length - 1) {
        switchAudio(currentPlaylistIndex + 1);
      } else if (playMode === "repeat-list") {
        switchAudio(0);
      } else {
        playButton.innerHTML="qwq";
        record.classList.remove("spinning");
      }
    }

    /*播放结束*/
    audio.addEventListener("ended",()=>{
      handleAutoNext();
    });

    /*页面可见性变化：解锁手机后恢复被后台挂起的播放*/
    document.addEventListener("visibilitychange", function() {
      if (!document.hidden && !isUserPaused && audio.paused && playlist.length > 0) {
        audio.play().catch(function(){});
        playButton.innerHTML = "Ⅱ";
        record.classList.add("spinning");
      }
    });

    /*时间格式*/
    function formatTime(seconds){
      if (
              isNaN(seconds)
      ){
        return "00:00";
      }
      const minutes= Math.floor(seconds/60);
      const remainingSeconds=Math.floor(seconds % 60);
      return minutes + ":" + remainingSeconds.toString().padStart(2,"0");
    }

    /*写入NFC卡片*/
    async function writeNFC() {
      const btn = document.querySelector(".nfc-button");
      if (!("NDEFReader" in window)) {
        alert("当前浏览器不支持 NFC 写入。\n\n请用安卓手机的 Chrome 或 Edge 浏览器打开此页面，\n不支持微信、QQ、夸克、UC 等浏览器。");
        return;
      }
      try {
        btn.textContent = "正在写入，请将卡片贴近手机…";
        btn.disabled = true;
        const ndef = new NDEFReader();
        await ndef.write({
          records: [{
            recordType: "url",
            data: window.location.href
          }]
        });
        alert("写入成功！现在用手机碰这张卡片就能打开这个页面啦");
      } catch (err) {
        let msg = err.message || String(err);
        if (err.name === "NotAllowedError") {
          msg = "NFC 权限被拒绝，请在浏览器设置中允许使用 NFC";
        } else if (err.name === "NotFoundError") {
          msg = "没有检测到 NFC 卡片，请将卡片贴近手机背面顶部再试";
        }
        alert("写入失败：" + msg + "\n\n请检查：\n1. 手机设置里已开启 NFC\n2. 卡片贴近手机背面顶部（摄像头附近）\n3. 卡片是空白或可复写的 NDEF 卡（部分门禁卡不支持）");
      } finally {
        btn.textContent = "写入 NFC 卡片";
        btn.disabled = false;
      }
    }

    /*========== 播放列表功能 ==========*/
    const playlistPanel = document.getElementById("playlistPanel");
    const playlistBar = document.getElementById("playlistBar");
    const playlistClose = document.getElementById("playlistClose");
    const playlistMask = document.getElementById("playlistMask");
    const playlistItems = document.getElementById("playlistItems");
    const playlistCount = document.getElementById("playlistCount");
    const playlistModeIcon = document.getElementById("playlistModeIcon");
    const addSongBtn = document.getElementById("addSongBtn");
    const addSongModal = document.getElementById("addSongModal");
    const addSongClose = document.getElementById("addSongClose");
    const addSongMask = document.getElementById("addSongMask");
    const addSongList = document.getElementById("addSongList");

    const modeLabels = {
      "order": "顺序",
      "repeat-list": "列表循环",
      "repeat-one": "单曲",
      "shuffle": "随机"
    };

    /*渲染播放列表*/
    function renderPlaylist() {
      playlistItems.innerHTML = "";
      playlist.forEach(function(songIdx, pIdx) {
        const song = allSongs[songIdx];
        const item = document.createElement("div");
        item.className = "playlist-item" + (pIdx === currentPlaylistIndex ? " playing" : "");
        item.innerHTML =
          '<span class="item-index">' + (pIdx === currentPlaylistIndex ? "♪" : (pIdx + 1)) + '</span>' +
          '<span class="item-name">' + song.name + '</span>' +
          '<span class="item-remove" data-pidx="' + pIdx + '">✕</span>';
        item.addEventListener("click", function(e) {
          if (e.target.classList.contains("item-remove")) return;
          switchAudio(pIdx);
        });
        playlistItems.appendChild(item);
      });
      /*绑定删除按钮*/
      playlistItems.querySelectorAll(".item-remove").forEach(function(btn) {
        btn.addEventListener("click", function(e) {
          e.stopPropagation();
          removeFromPlaylist(parseInt(this.dataset.pidx));
        });
      });
      playlistCount.textContent = playlist.length + "首";
    }

    /*从播放列表删除*/
    function removeFromPlaylist(pIdx) {
      if (playlist.length <= 1) {
        alert("播放列表至少要保留一首歌曲哦");
        return;
      }
      playlist.splice(pIdx, 1);
      if (pIdx < currentPlaylistIndex) {
        currentPlaylistIndex--;
      } else if (pIdx === currentPlaylistIndex) {
        if (currentPlaylistIndex >= playlist.length) {
          currentPlaylistIndex = 0;
        }
        switchAudio(currentPlaylistIndex);
      }
      renderPlaylist();
      renderAddSongList();
    }

    /*渲染添加歌曲列表*/
    function renderAddSongList() {
      addSongList.innerHTML = "";
      allSongs.forEach(function(song, idx) {
        const inPlaylist = playlist.indexOf(idx) !== -1;
        const item = document.createElement("div");
        item.className = "add-song-item" + (inPlaylist ? " disabled" : "");
        item.innerHTML =
          '<span class="add-item-name">' + song.name + '</span>' +
          '<span class="add-item-status">' + (inPlaylist ? "已在列表" : "+ 添加") + '</span>';
        if (!inPlaylist) {
          item.addEventListener("click", function() {
            playlist.push(idx);
            renderPlaylist();
            renderAddSongList();
          });
        }
        addSongList.appendChild(item);
      });
    }

    /*更新入口栏模式显示*/
    function updateModeIcon() {
      playlistModeIcon.textContent = modeLabels[playMode];
    }

    /*面板开关*/
    function openPlaylist() {
      playlistPanel.classList.add("show");
      renderPlaylist();
    }
    function closePlaylist() {
      playlistPanel.classList.remove("show");
    }
    playlistBar.addEventListener("click", openPlaylist);
    playlistClose.addEventListener("click", closePlaylist);
    playlistMask.addEventListener("click", closePlaylist);

    /*模式切换*/
    document.querySelectorAll(".mode-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        document.querySelectorAll(".mode-btn").forEach(function(b) {
          b.classList.remove("active");
        });
        this.classList.add("active");
        playMode = this.dataset.mode;
        updateModeIcon();
      });
    });

    /*添加歌曲弹窗*/
    addSongBtn.addEventListener("click", function() {
      renderAddSongList();
      addSongModal.classList.add("show");
    });
    function closeAddSong() {
      addSongModal.classList.remove("show");
    }
    addSongClose.addEventListener("click", closeAddSong);
    addSongMask.addEventListener("click", closeAddSong);

    /*初始化渲染*/
    renderPlaylist();
    renderAddSongList();
    updateModeIcon();

    /*========== 搜索 & 歌单系统 ==========*/
    // 后端API地址（Vercel同域部署，留空即可；如果单独部署后端，填Vercel域名如 "https://xxx.vercel.app"）
    const API_BASE = "";

    // 歌单数据：默认歌单是原5首本地歌曲
    let userPlaylists = {
      "default": {
        id: "default",
        name: "我的最爱",
        songs: [0, 1, 2, 3, 4], // allSongs索引（本地歌曲）
        isDefault: true
      }
    };
    let currentPlaylistId = "default";
    let currentDetailPlaylistId = null; // 当前查看的歌单详情ID
    let currentSearchResults = [];
    let currentSearchTab = "search";
    let pendingAddSong = null;
    let pendingAddPlaylistId = null;
    let isSearching = false;

    // DOM元素
    const searchBarInput = document.getElementById("searchBarInput");
    const searchModal = document.getElementById("searchModal");
    const searchModalMask = document.getElementById("searchModalMask");
    const searchModalClose = document.getElementById("searchModalClose");
    const searchInput = document.getElementById("searchInput");
    const searchSubmit = document.getElementById("searchSubmit");
    const searchResults = document.getElementById("searchResults");
    const searchTabs = document.querySelectorAll(".search-tab");

    // 生成歌单ID
    function generatePlaylistId() {
      return "pl_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5);
    }

    // 查找或添加搜索歌曲到allSongs，返回allSongs索引
    function findOrAddSearchSong(song) {
      const songId = "search_" + song.id;
      // 先查找是否已存在
      for (let i = 0; i < allSongs.length; i++) {
        if (allSongs[i]._uid === songId) return i;
      }
      // 添加到allSongs
      const idx = allSongs.length;
      allSongs.push({
        src: (API_BASE || "") + "/api/play?id=" + song.id,
        name: song.name,
        artist: song.artist || "",
        source: "search",
        _uid: songId
      });
      return idx;
    }

    // 根据uid查找allSongs索引
    function findSongIndexByUid(uid) {
      for (let i = 0; i < allSongs.length; i++) {
        if (allSongs[i]._uid === uid) return i;
      }
      return -1;
    }

    /*-------- 搜索弹窗 --------*/
    function openSearchPanel() {
      searchModal.classList.add("show");
      searchModalMask.classList.add("show");
      currentDetailPlaylistId = null; // 打开时清空歌单详情
      if (currentSearchTab === "playlists") {
        renderPlaylistManager();
      }
      // 自动聚焦搜索框（延迟等待动画）
      setTimeout(function() {
        searchInput.focus();
        searchInput.select();
      }, 300);
    }
    function closeSearchPanel() {
      searchModal.classList.remove("show");
      searchModalMask.classList.remove("show");
      searchInput.blur();
    }
    searchBarInput.addEventListener("click", function(e) {
      e.stopPropagation();
      openSearchPanel();
    });
    searchModalClose.addEventListener("click", closeSearchPanel);
    searchModalMask.addEventListener("click", closeSearchPanel);

    // 标签页切换
    searchTabs.forEach(function(tab) {
      tab.addEventListener("click", function() {
        searchTabs.forEach(function(t) { t.classList.remove("active"); });
        this.classList.add("active");
        currentSearchTab = this.dataset.tab;
        currentDetailPlaylistId = null; // 切换标签时清空歌单详情
        if (currentSearchTab === "search") {
          if (currentSearchResults.length > 0) {
            renderSearchResults(currentSearchResults);
          } else {
            showSearchStatus('<span class="icon">🎵</span>输入歌名或歌手，开始搜索吧~');
          }
        } else {
          renderPlaylistManager();
        }
      });
    });

    // 显示搜索状态（加载中/空/错误）
    function showSearchStatus(html) {
      searchResults.innerHTML = '<div class="search-status">' + html + '</div>';
    }

    // 执行搜索
    function doSearch() {
      const keyword = searchInput.value.trim();
      if (!keyword) {
        showSearchStatus('<span class="icon">✏️</span>请输入搜索关键词');
        return;
      }
      if (isSearching) return;
      isSearching = true;
      showSearchStatus('<span class="search-loading"></span><br><br>正在搜索 "' + keyword + '" ...');

      const url = (API_BASE || "") + "/api/search?keyword=" + encodeURIComponent(keyword);
      fetch(url)
        .then(function(resp) { return resp.json(); })
        .then(function(data) {
          isSearching = false;
          if (data.error) {
            showSearchStatus('<span class="icon">😢</span>搜索失败：' + data.error + '<br><br>请检查后端API是否已部署');
            return;
          }
          currentSearchResults = data.songs || [];
          if (currentSearchResults.length === 0) {
            showSearchStatus('<span class="icon">🔍</span>没有找到相关歌曲<br><br>换个关键词试试吧~');
            return;
          }
          renderSearchResults(currentSearchResults);
        })
        .catch(function(err) {
          isSearching = false;
          showSearchStatus('<span class="icon">😢</span>搜索失败：网络错误<br><br>' + err.message + '<br><br>请检查后端API是否已部署');
        });
    }
    searchSubmit.addEventListener("click", doSearch);
    searchInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") doSearch();
    });

    // 渲染搜索结果
    function renderSearchResults(songs) {
      searchResults.innerHTML = "";
      songs.forEach(function(song, idx) {
        const item = document.createElement("div");
        item.className = "search-result-item";
        item.innerHTML =
          '<div class="search-result-info">' +
            '<div class="search-result-name">' + escapeHtml(song.name) + '</div>' +
            '<div class="search-result-artist">' + escapeHtml(song.artist || "未知歌手") + '</div>' +
          '</div>' +
          '<div class="search-result-actions">' +
            '<button class="search-action-btn play-btn" title="播放">▶</button>' +
            '<button class="search-action-btn add-btn" title="添加到歌单">+</button>' +
          '</div>';
        // 播放按钮
        item.querySelector(".play-btn").addEventListener("click", function(e) {
          e.stopPropagation();
          playSearchSong(song);
        });
        // 添加按钮
        item.querySelector(".add-btn").addEventListener("click", function(e) {
          e.stopPropagation();
          showAddToPlaylistModal(song);
        });
        // 点击整行也播放
        item.addEventListener("click", function() {
          playSearchSong(song);
        });
        searchResults.appendChild(item);
      });
    }

    // HTML转义
    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    // 播放搜索到的歌曲
    function playSearchSong(song) {
      const songIdx = findOrAddSearchSong(song);
      // 添加到当前播放列表（如果不在）
      if (playlist.indexOf(songIdx) === -1) {
        playlist.push(songIdx);
      }
      const pIdx = playlist.indexOf(songIdx);
      switchAudio(pIdx);
      closeSearchPanel();
      // 提示
      showToast("正在播放：" + song.name);
    }

    // 简单提示
    function showToast(msg) {
      let toast = document.getElementById("customToast");
      if (!toast) {
        toast = document.createElement("div");
        toast.id = "customToast";
        toast.style.cssText = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:white;padding:12px 24px;border-radius:12px;font-size:14px;z-index:99999;pointer-events:none;transition:opacity 0.3s;opacity:0;";
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.style.opacity = "1";
      setTimeout(function() { toast.style.opacity = "0"; }, 1500);
    }

    /*-------- 歌单管理 --------*/
    // 渲染歌单列表
    function renderPlaylistManager() {
      searchResults.innerHTML = "";
      const manager = document.createElement("div");
      manager.className = "playlist-manager";

      // 头部
      const header = document.createElement("div");
      header.className = "playlist-manager-header";
      header.innerHTML =
        '<span class="playlist-manager-title">我的歌单 (' + Object.keys(userPlaylists).length + ')</span>' +
        '<button class="playlist-create-btn" id="createPlaylistBtn">+ 新建歌单</button>';
      manager.appendChild(header);

      // 歌单列表
      Object.values(userPlaylists).forEach(function(pl) {
        const item = document.createElement("div");
        item.className = "user-playlist-item" + (pl.id === currentPlaylistId ? " active" : "") + (pl.isDefault ? " default-playlist" : "");
        const songCount = pl.songs.length;
        item.innerHTML =
          '<div class="user-playlist-icon">' + (pl.isDefault ? "💖" : "📁") + '</div>' +
          '<div class="user-playlist-info">' +
            '<div class="user-playlist-name">' + escapeHtml(pl.name) + '</div>' +
            '<div class="user-playlist-count">' + songCount + '首歌曲</div>' +
          '</div>' +
          '<div class="user-playlist-actions">' +
            '<button class="user-playlist-action-btn play-playlist-btn" title="播放">▶</button>' +
            (!pl.isDefault ? '<button class="user-playlist-action-btn rename-btn" title="重命名">✏️</button>' : '') +
            (!pl.isDefault ? '<button class="user-playlist-action-btn delete-btn" title="删除">🗑️</button>' : '') +
          '</div>';
        // 点击进入歌单详情
        item.addEventListener("click", function(e) {
          if (e.target.closest(".rename-btn") || e.target.closest(".delete-btn") || e.target.closest(".play-playlist-btn")) return;
          renderPlaylistDetail(pl.id);
        });
        // 播放歌单
        const playBtn = item.querySelector(".play-playlist-btn");
        if (playBtn) {
          playBtn.addEventListener("click", function(e) {
            e.stopPropagation();
            switchUserPlaylist(pl.id);
          });
        }
        // 重命名
        const renameBtn = item.querySelector(".rename-btn");
        if (renameBtn) {
          renameBtn.addEventListener("click", function(e) {
            e.stopPropagation();
            const newName = prompt("请输入新的歌单名称：", pl.name);
            if (newName && newName.trim()) {
              pl.name = newName.trim();
              savePlaylists();
              renderPlaylistManager();
            }
          });
        }
        // 删除
        const deleteBtn = item.querySelector(".delete-btn");
        if (deleteBtn) {
          deleteBtn.addEventListener("click", function(e) {
            e.stopPropagation();
            if (confirm("确定要删除歌单「" + pl.name + "」吗？")) {
              delete userPlaylists[pl.id];
              if (currentPlaylistId === pl.id) {
                currentPlaylistId = "default";
                switchUserPlaylist("default");
              }
              savePlaylists();
              renderPlaylistManager();
            }
          });
        }
        manager.appendChild(item);
      });

      searchResults.appendChild(manager);

      // 新建歌单按钮
      document.getElementById("createPlaylistBtn").addEventListener("click", function() {
        document.getElementById("createPlaylistModal").classList.add("show");
        document.getElementById("createPlaylistInput").value = "";
        document.getElementById("createPlaylistInput").focus();
      });
    }

    // 渲染歌单详情页
    function renderPlaylistDetail(playlistId) {
      const pl = userPlaylists[playlistId];
      if (!pl) return;
      currentDetailPlaylistId = playlistId;
      searchResults.innerHTML = "";

      const detail = document.createElement("div");
      detail.className = "playlist-detail";

      // 顶部
      const header = document.createElement("div");
      header.className = "playlist-detail-header";
      header.innerHTML =
        '<span class="playlist-detail-back" id="detailBackBtn">←</span>' +
        '<div class="playlist-detail-info">' +
          '<div class="playlist-detail-name">' + escapeHtml(pl.name) + '</div>' +
          '<div class="playlist-detail-count">' + pl.songs.length + '首歌曲</div>' +
        '</div>' +
        '<button class="playlist-detail-add-btn" id="detailAddBtn">+ 添加</button>';
      detail.appendChild(header);

      // 歌曲列表
      const songsContainer = document.createElement("div");
      songsContainer.className = "playlist-detail-songs";

      if (pl.songs.length === 0) {
        // 空歌单
        const empty = document.createElement("div");
        empty.className = "playlist-empty";
        empty.innerHTML = '<span class="icon">🎵</span>歌单是空的~<br>点击右上角「+ 添加」加入歌曲吧';
        songsContainer.appendChild(empty);
      } else {
        pl.songs.forEach(function(songRef, idx) {
          let songName = "";
          let songArtist = "";
          let songIdx = -1;

          if (typeof songRef === "number") {
            // 本地歌曲
            songIdx = songRef;
            if (allSongs[songIdx]) {
              songName = allSongs[songIdx].name;
              songArtist = allSongs[songIdx].artist || "本地歌曲";
            }
          } else if (typeof songRef === "object" && songRef.type === "search") {
            // 搜索歌曲
            songName = songRef.name;
            songArtist = songRef.artist || "在线歌曲";
            // 确保在 allSongs 里
            songIdx = findOrAddSearchSong({ id: songRef.id, name: songRef.name, artist: songRef.artist });
          }

          const item = document.createElement("div");
          item.className = "playlist-song-item";
          // 检查是否正在播放
          if (currentPlaylistId === playlistId && currentPlaylistIndex === idx) {
            item.classList.add("playing");
          }
          item.innerHTML =
            '<span class="playlist-song-index">' + (item.classList.contains("playing") ? "♪" : (idx + 1)) + '</span>' +
            '<div class="playlist-song-info">' +
              '<div class="playlist-song-name">' + escapeHtml(songName) + '</div>' +
              '<div class="playlist-song-artist">' + escapeHtml(songArtist) + '</div>' +
            '</div>' +
            '<button class="playlist-song-remove" data-idx="' + idx + '" title="移除">✕</button>';

          // 点击播放
          item.addEventListener("click", function(e) {
            if (e.target.closest(".playlist-song-remove")) return;
            if (currentPlaylistId !== playlistId) {
              switchUserPlaylist(playlistId);
            }
            switchAudio(idx);
            renderPlaylistDetail(playlistId);
          });

          // 移除歌曲
          const removeBtn = item.querySelector(".playlist-song-remove");
          removeBtn.addEventListener("click", function(e) {
            e.stopPropagation();
            const removeIdx = parseInt(this.dataset.idx);
            removeSongFromPlaylist(playlistId, removeIdx);
          });

          songsContainer.appendChild(item);
        });
      }

      detail.appendChild(songsContainer);
      searchResults.appendChild(detail);

      // 返回按钮
      document.getElementById("detailBackBtn").addEventListener("click", function() {
        currentDetailPlaylistId = null;
        renderPlaylistManager();
      });

      // 添加歌曲按钮
      document.getElementById("detailAddBtn").addEventListener("click", function() {
        showAddSongToPlaylistModal(playlistId);
      });
    }

    // 从歌单移除歌曲
    function removeSongFromPlaylist(playlistId, songIdx) {
      const pl = userPlaylists[playlistId];
      if (!pl) return;
      const removed = pl.songs.splice(songIdx, 1)[0];
      savePlaylists();

      // 如果正在播放这个歌单，需要更新播放列表
      if (currentPlaylistId === playlistId) {
        const newPlaylist = [];
        pl.songs.forEach(function(songRef) {
          if (typeof songRef === "number") {
            if (songRef < allSongs.length) newPlaylist.push(songRef);
          } else if (typeof songRef === "object" && songRef.type === "search") {
            const idx = findOrAddSearchSong({ id: songRef.id, name: songRef.name, artist: songRef.artist });
            newPlaylist.push(idx);
          }
        });
        playlist = newPlaylist;
        if (currentPlaylistIndex >= playlist.length) {
          currentPlaylistIndex = Math.max(0, playlist.length - 1);
        }
        if (playlist.length > 0) {
          switchAudio(currentPlaylistIndex);
        } else {
          audio.pause();
        }
        renderPlaylist();
      }

      showToast("已移除歌曲");
      renderPlaylistDetail(playlistId);
    }

    // 显示添加歌曲到歌单弹窗
    function showAddSongToPlaylistModal(playlistId) {
      const pl = userPlaylists[playlistId];
      if (!pl) return;
      pendingAddPlaylistId = playlistId;

      addSongList.innerHTML = "";

      // 标题
      const title = document.createElement("div");
      title.style.cssText = "padding:10px 18px 6px;font-size:12px;color:#b08a98;";
      title.textContent = "本地歌曲（" + Math.min(5, allSongs.length) + "首）";
      addSongList.appendChild(title);

      // 本地歌曲列表
      for (let i = 0; i < Math.min(5, allSongs.length); i++) {
        const song = allSongs[i];
        const inPlaylist = pl.songs.indexOf(i) !== -1;
        const item = document.createElement("div");
        item.className = "add-song-item";
        item.innerHTML =
          '<div class="add-song-item-info">' +
            '<div class="add-song-item-name">' + escapeHtml(song.name) + '</div>' +
            '<div class="add-song-item-artist">' + escapeHtml(song.artist || "本地歌曲") + '</div>' +
          '</div>' +
          '<button class="add-song-item-btn' + (inPlaylist ? ' added' : '') + '">' + (inPlaylist ? '已添加' : '+ 添加') + '</button>';

        if (!inPlaylist) {
          item.querySelector(".add-song-item-btn").addEventListener("click", function(e) {
            e.stopPropagation();
            addSongToPlaylist(song, playlistId);
            // 刷新弹窗
            showAddSongToPlaylistModal(playlistId);
            // 刷新歌单详情
            if (currentDetailPlaylistId === playlistId) {
              renderPlaylistDetail(playlistId);
            }
          });
        }
        addSongList.appendChild(item);
      }

      // 搜索更多提示
      const hint = document.createElement("div");
      hint.className = "add-song-search-hint";
      hint.innerHTML = '想要更多歌曲？<br><button id="goSearchBtn">去搜索在线音乐</button>';
      addSongList.appendChild(hint);

      document.getElementById("goSearchBtn").addEventListener("click", function() {
        addSongModal.classList.remove("show");
        // 切换到搜索标签页
        document.querySelectorAll('.search-tab')[0].click();
      });

      addSongModal.classList.add("show");
    }

    // 切换歌单
    function switchUserPlaylist(playlistId) {
      const pl = userPlaylists[playlistId];
      if (!pl) return;
      currentPlaylistId = playlistId;
      // 构建新的播放列表
      const newPlaylist = [];
      pl.songs.forEach(function(songRef) {
        if (typeof songRef === "number") {
          // 本地歌曲（索引）
          if (songRef < 5) newPlaylist.push(songRef);
        } else if (typeof songRef === "object" && songRef.type === "search") {
          // 搜索歌曲
          const idx = findOrAddSearchSong({ id: songRef.id, name: songRef.name, artist: songRef.artist });
          newPlaylist.push(idx);
        }
      });
      if (newPlaylist.length === 0) {
        showToast("这个歌单是空的~");
        return;
      }
      playlist = newPlaylist;
      currentPlaylistIndex = 0;
      switchAudio(0);
      renderPlaylist();
      if (currentSearchTab === "playlists") {
        if (currentDetailPlaylistId) {
          renderPlaylistDetail(currentDetailPlaylistId);
        } else {
          renderPlaylistManager();
        }
      }
      showToast("已切换到：" + pl.name);
    }

    // 新建歌单
    function createUserPlaylist(name) {
      const id = generatePlaylistId();
      userPlaylists[id] = {
        id: id,
        name: name,
        songs: [],
        isDefault: false
      };
      savePlaylists();
      return id;
    }

    // 新建歌单弹窗
    const createPlaylistModal = document.getElementById("createPlaylistModal");
    const createPlaylistMask = document.getElementById("createPlaylistMask");
    const createPlaylistInput = document.getElementById("createPlaylistInput");
    document.getElementById("createPlaylistCancel").addEventListener("click", function() {
      createPlaylistModal.classList.remove("show");
    });
    createPlaylistMask.addEventListener("click", function() {
      createPlaylistModal.classList.remove("show");
    });
    document.getElementById("createPlaylistConfirm").addEventListener("click", function() {
      const name = createPlaylistInput.value.trim();
      if (!name) {
        alert("请输入歌单名称");
        return;
      }
      createUserPlaylist(name);
      createPlaylistModal.classList.remove("show");
      renderPlaylistManager();
      showToast("歌单「" + name + "」创建成功");
    });
    createPlaylistInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") document.getElementById("createPlaylistConfirm").click();
    });

    /*-------- 添加到歌单 --------*/
    const addToPlaylistModal = document.getElementById("addToPlaylistModal");
    const addToPlaylistMask = document.getElementById("addToPlaylistMask");
    const addToPlaylistList = document.getElementById("addToPlaylistList");

    function showAddToPlaylistModal(song) {
      pendingAddSong = song;
      addToPlaylistList.innerHTML = "";
      Object.values(userPlaylists).forEach(function(pl) {
        const item = document.createElement("div");
        item.className = "add-to-playlist-item";
        item.innerHTML =
          '<span class="name">' + (pl.isDefault ? "💖 " : "📁 ") + escapeHtml(pl.name) + '</span>' +
          '<span class="count">' + pl.songs.length + '首</span>';
        item.addEventListener("click", function() {
          addSongToPlaylist(pendingAddSong, pl.id);
          addToPlaylistModal.classList.remove("show");
        });
        addToPlaylistList.appendChild(item);
      });
      // 新建歌单选项
      const newItem = document.createElement("div");
      newItem.className = "add-to-playlist-item";
      newItem.innerHTML = '<span class="name" style="color:#d86f98;">+ 新建歌单</span><span class="count"></span>';
      newItem.addEventListener("click", function() {
        addToPlaylistModal.classList.remove("show");
        const name = prompt("请输入新歌单名称：");
        if (name && name.trim()) {
          const newId = createUserPlaylist(name.trim());
          addSongToPlaylist(pendingAddSong, newId);
          if (currentSearchTab === "playlists") renderPlaylistManager();
        }
      });
      addToPlaylistList.appendChild(newItem);

      addToPlaylistModal.classList.add("show");
    }
    document.getElementById("addToPlaylistClose").addEventListener("click", function() {
      addToPlaylistModal.classList.remove("show");
    });
    addToPlaylistMask.addEventListener("click", function() {
      addToPlaylistModal.classList.remove("show");
    });

    // 添加歌曲到指定歌单
    function addSongToPlaylist(song, playlistId) {
      const pl = userPlaylists[playlistId];
      if (!pl) return;
      let songRef;
      if (song.source === "search" || song.id) {
        // 搜索歌曲
        songRef = { type: "search", id: song.id, name: song.name, artist: song.artist || "" };
        // 检查是否已存在
        const exists = pl.songs.some(function(s) {
          return typeof s === "object" && s.type === "search" && s.id === song.id;
        });
        if (exists) {
          showToast("歌曲已在歌单中");
          return;
        }
      } else {
        // 本地歌曲（allSongs索引）
        const idx = allSongs.indexOf(song);
        songRef = idx >= 0 ? idx : 0;
        if (pl.songs.indexOf(songRef) !== -1) {
          showToast("歌曲已在歌单中");
          return;
        }
      }
      pl.songs.push(songRef);
      savePlaylists();
      showToast("已添加到「" + pl.name + "」");
      // 刷新歌单详情页
      if (currentDetailPlaylistId === playlistId) {
        renderPlaylistDetail(playlistId);
      }
      // 刷新歌单列表
      if (currentSearchTab === "playlists" && !currentDetailPlaylistId) {
        renderPlaylistManager();
      }
    }

    /*-------- localStorage 持久化 --------*/
    function savePlaylists() {
      try {
        // 只保存非默认歌单（默认歌单固定是原5首）
        const toSave = {};
        Object.values(userPlaylists).forEach(function(pl) {
          if (!pl.isDefault) {
            toSave[pl.id] = {
              id: pl.id,
              name: pl.name,
              songs: pl.songs,
              isDefault: false
            };
          }
        });
        localStorage.setItem("lovezz_user_playlists", JSON.stringify(toSave));
      } catch(e) {
        console.warn("保存歌单失败", e);
      }
    }

    function loadPlaylists() {
      try {
        const data = localStorage.getItem("lovezz_user_playlists");
        if (data) {
          const saved = JSON.parse(data);
          Object.values(saved).forEach(function(pl) {
            if (!pl.isDefault) {
              userPlaylists[pl.id] = pl;
            }
          });
        }
      } catch(e) {
        console.warn("加载歌单失败", e);
      }
    }

    // 初始化加载歌单
    loadPlaylists();

  </script>
  </body>
</html>
