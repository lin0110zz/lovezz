<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>love you ♡</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100dvh;
        font-family: "Microoft "Microsoft YaHei ", "PingFang SC", sans-serif;
        overflow: hidden;
        background: radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.8), transparent 25%),
        radial-gradient(circle at 80% 30%, rgba(255, 220, 235, 0.8), transparent 30%),
        linear-gradient(135deg, #ffe6ee, #fff4f7, #ffdce9);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }

      /*页面*/
      .page{
        position: absolute;
        width: 100%;
        height: 100dvh;

        display: none;
        align-items: center;
        justify-content: center;
      }

      /*当前显示页面*/
      .page.active{
        display: flex !important;
        opacity: 1 !important;
        visibility: visible;!important;
        pointer-events: auto;!important;
        position: relative;!important;
        z-index: 9999 !important;
        height: 100dvh !important;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
      }

      /* 第一页 */
      .capsule{
        width: 88%;
        max-width: 420px;
        padding: 55px 30px;
        text-align: center;
        background: rgba(255,255,255,0.75);
        border-radius: 32px;
        box-shadow: 0 20px 60px rgba(220,120,160,0.18);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.8);
        margin: auto;
      }

      .small-heart {
        font-size: 45px;
        margin-bottom: 20px;
        animation: heartbeat 2s infinite;
        white-space: nowrap;
      }
      @keyframes heartbeat {
        0%,100%{
          transform: scale(1);
        }
        50%{
          transform: scale(1.12);
        }
      }

      .capsule h1{
        font-size: 26px;
        color: #d86f98;
        margin-bottom: 20px;
        font-weight: 500;
      }

      .capsule p{
        font-size: 15px;
        color: #9b7180;
        line-height: 2;
        margin-bottom: 35px;
      }

      .open-button{
        border: none;
        padding: 15px 38px;
        border-radius: 50px;
        font-size: 16px;
        cursor: pointer;
        color: white;
        background: linear-gradient(135deg,#f6a6bd,#e889a8);
        box-shadow: 0 8px 20px rgba(225,120,155,0.35);
        transition: 0.3s;
      }

      .open-button:hover{
        transform: translateY(-3px)scale(0.97);
      }

      /*第二页*/

      .memory-card{
        width: 88%;
        max-width: 430px;
        padding:40px 28px;
        text-align: center;
        background: rgba(255,255,255,0.82);
        border-radius: 30px;
        box-shadow: 0 25px 70px rgba(220,120,160,0.2);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255,255,255,0.9);
        margin: auto;
      }

      .top-decoration{
        font-size: 30px;
        margin-bottom: 20px;
      }

      .memory-card h2{
        color: #d86f98;
        font-size: 24px;
        font-weight: 500;
        margin-bottom: 15px;
      }

      .memory-text{
        color: #a27b89;
        font-size: 14px;
        line-height: 2;
        margin-bottom: 35px;
      }

      /*歌曲名称*/
      .song-name{
        text-align: center;
        color: #d86f98;
        font-size: 17px;
        font-weight: 600;
        margin: 0 auto 14px;
        letter-spacing: 1.5px;
        opacity: 0.92;
        transition: opacity 0.3s ease;
      }
      .song-name::before{
        content: "♡ ";
        font-size: 14px;
        color: #e89ab3;
      }

      /*唱片*/
      .record-wrapper{
        width: 170px;
        height: 170px;
        margin: 0 auto 35px;
        position: relative;
        cursor: grab;
        transition: transform 0.3s ease;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        -webkit-touch-callout: none;
      }
      .record-wrapper:active{
        cursor: grabbing;
      }
      .record{
        width: 170px;
        height: 170px;
        margin: 0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        background: repeating-radial-gradient(
        circle,#e89ab3 0px,#e89ab3 3px,#df88a6 4px,#df88a6 7px
        );
        box-shadow: 0 10px 30px rgba(200,100,140,0.25);
      }

      .record::before{
        content: "";
        width: 62px;
        height: 62px;
        border-radius: 50%;
        background: linear-gradient(135deg,#ffe8d5,#f7aec4);
        position: absolute;
      }

      .record::after{
        content: "♡";
        position: absolute;
        font-size: 24px;
        color: white;
        z-index: 2;
      }

      .spinning{
        animation: spin 6s linear infinite;
      }
      @keyframes spin {
        from {
          transform: rotate(360deg);
        }
      }

      /*播放按钮*/
      .play-button{
        width: 72px;
        height: 72px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        font-size: 28px;
        color: white;
        background: linear-gradient(135deg,#f5a1bb,#e77f9f);
        box-shadow: 0 10px 25px rgba(220,100,145,0.35);
        transition: 0.3s;
        margin-bottom: 28px;
      }

      .play-button:hover{
        transform: scale(1.08);
      }

      .play-button:active{
        transform: scale(0.94);
      }

      /*进度条*/
      .progress-container{
        width: 100%;
        height: 6px;
        border-radius: 10px;
        background: #f7d6e0;
        cursor: pointer;
        overflow: hidden;
        margin-bottom: 14px;
      }

      .progress{
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg,#f3a0b9,#df7f9f);
        border-radius: 10px;
      }


      /*时间*/
      .time{
        display: flex;
        justify-content: space-between;
        color: #b48796;
        font-size: 12px;
      }

      .date{
        margin-top: 30px;
        font-size: 12px;
        color: #c59aa9;
      }

      /*NFC写入按钮*/
      .nfc-button{
        margin-top: 18px;
        border: none;
        padding: 11px 28px;
        border-radius: 50px;
        font-size: 13px;
        cursor: pointer;
        color: white;
        background: linear-gradient(135deg,#f6a6bd,#e889a8);
        box-shadow: 0 6px 16px rgba(225,120,155,0.3);
        transition: 0.3s;
      }
      .nfc-button:hover{
        transform: translateY(-2px);
      }
      .nfc-button:active{
        transform: scale(0.96);
      }

      /*漂浮元素*/
      .floating{
        position: absolute;
        color: rgba(255,150,185,0.35);
        animation: float 12s ease-in-out infinite;
        pointer-events: none;
      }

      .f1{ top: 6%; left: 8%; font-size: 34px; animation-delay: 0s; }
      .f2{ top: 12%; right: 10%; font-size: 26px; animation-delay: 1.5s; }
      .f3{ top: 22%; left: 4%; font-size: 23px; animation-delay: 3s; }
      .f4{ top: 18%; right: 28%; font-size: 31px; animation-delay: 0.8s; }
      .f5{ top: 35%; left: 14%; font-size: 29px; animation-delay: 2.2s; }
      .f6{ top: 40%; right: 6%; font-size: 36px; animation-delay: 4s; }
      .f7{ top: 50%; left: 28%; font-size: 21px; animation-delay: 1s; }
      .f8{ top: 55%; right: 18%; font-size: 26px; animation-delay: 3.5s; }
      .f9{ top: 65%; left: 8%; font-size: 39px; animation-delay: 0.5s; }
      .f10{ top: 70%; right: 12%; font-size: 31px; animation-delay: 2.8s; }
      .f11{ top: 4%; left: 42%; font-size: 23px; animation-delay: 5s; }
      .f12{ top: 30%; left: 48%; font-size: 26px; animation-delay: 1.8s; }
      .f13{ top: 78%; left: 40%; font-size: 29px; animation-delay: 4.2s; }
      .f14{ top: 60%; right: 35%; font-size: 21px; animation-delay: 0.3s; }
      .f15{ bottom: 6%; left: 22%; font-size: 34px; animation-delay: 3.2s; }
      .f16{ top: 8%; right: 42%; font-size: 26px; animation-delay: 2.5s; }

      @keyframes float {
        0%,100%{
          transform: translateY(0px) rotate(0deg);
        }
        50%{
          transform: translateY(-22px) rotate(8deg);
        }
      }

      /*移动端适配*/
      @media (max-width: 430px) {
        .capsule{
          padding: 36px 20px;
        }
        .capsule h1{
          font-size: 22px;
          margin-bottom: 14px;
        }
        .capsule p{
          font-size: 14px;
          line-height: 1.9;
          margin-bottom: 24px;
        }
        .open-button{
          padding: 13px 34px;
          font-size: 15px;
        }
        .small-heart{
          font-size: 30px;
          margin-bottom: 12px;
        }

        .memory-card{
          padding: 26px 18px;
        }
        .memory-card h2{
          font-size: 20px;
          margin-bottom: 10px;
        }
        .memory-text{
          font-size: 13px;
          margin-bottom: 22px;
        }
        .record{
          width: 130px;
          height: 130px;
        }
        .record-wrapper{
          width: 130px;
          height: 130px;
          margin: 0 auto 22px;
        }
        .record::before{
          width: 48px;
          height: 48px;
        }
        .song-name{
          font-size: 14px;
          margin-bottom: 10px;
          letter-spacing: 1px;
        }
        .play-button{
          width: 60px;
          height: 60px;
          font-size: 24px;
          margin-bottom: 18px;
        }
        .progress-container{
          height: 5px;
          margin-bottom: 10px;
        }
        .time{
          font-size: 11px;
        }
        .date{
          margin-top: 18px;
        }
        .nfc-button{
          margin-top: 12px;
        }
        .playlist-bar{
          padding: 6px 14px;
          font-size: 12px;
          gap: 6px;
        }
        .playlist-content{
          max-height: 75vh;
        }
        .mode-btn .mode-icon{
          font-size: 16px;
        }
        .mode-btn .mode-text{
          font-size: 10px;
        }
      }

      /*播放列表入口栏*/
      .playlist-bar{
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin: 0 auto 14px;
        padding: 8px 18px;
        background: rgba(255, 235, 240, 0.7);
        border-radius: 20px;
        font-size: 13px;
        color: #c59aa9;
        cursor: pointer;
        transition: all 0.2s ease;
        width: fit-content;
        user-select: none;
      }
      .playlist-bar:hover{
        background: rgba(255, 220, 230, 0.9);
        color: #d86f98;
      }
      .playlist-bar-icon{
        font-size: 15px;
      }
      .playlist-bar-title{
        font-weight: 600;
        color: #d86f98;
      }
      .playlist-bar-count{
        color: #b48796;
        font-size: 12px;
      }
      .playlist-bar-mode{
        padding: 2px 8px;
        background: #f7aec4;
        color: white;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 600;
      }

      /*播放列表面板*/
      .playlist-panel{
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1000;
        display: none;
      }
      .playlist-panel.show{
        display: block;
      }
      .playlist-mask{
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
      }
      .playlist-content{
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        max-height: 70vh;
        background: #fff5f7;
        border-radius: 20px 20px 0 0;
        display: flex;
        flex-direction: column;
        animation: slideUp 0.3s ease;
      }
      @keyframes slideUp{
        from{ transform: translateY(100%); }
        to{ transform: translateY(0); }
      }
      .playlist-header{
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px 12px;
        border-bottom: 1px solid #ffe0e8;
      }
      .playlist-title{
        font-size: 17px;
        font-weight: 700;
        color: #d86f98;
      }
      .playlist-close{
        font-size: 18px;
        color: #c59aa9;
        cursor: pointer;
        padding: 4px 8px;
      }
      .playlist-modes{
        display: flex;
        gap: 8px;
        padding: 12px 20px;
        border-bottom: 1px solid #ffe0e8;
      }
      .mode-btn{
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 8px 4px;
        border: none;
        background: transparent;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .mode-btn .mode-icon{
        font-size: 18px;
      }
      .mode-btn .mode-text{
        font-size: 11px;
        color: #b48796;
      }
      .mode-btn.active{
        background: #f7aec4;
      }
      .mode-btn.active .mode-text{
        color: white;
        font-weight: 600;
      }
      .playlist-items{
        flex: 1;
        overflow-y: auto;
        padding: 8px 0;
      }
      .playlist-item{
        display: flex;
        align-items: center;
        padding: 12px 20px;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .playlist-item:hover{
        background: rgba(247, 174, 196, 0.15);
      }
      .playlist-item.playing{
        background: rgba(247, 174, 196, 0.2);
      }
      .playlist-item.playing .item-index{
        color: #d86f98;
        font-weight: 700;
      }
      .playlist-item.playing .item-name{
        color: #d86f98;
        font-weight: 600;
      }
      .item-index{
        width: 28px;
        font-size: 14px;
        color: #c59aa9;
        text-align: center;
      }
      .item-name{
        flex: 1;
        font-size: 14px;
        color: #7a5c68;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .item-remove{
        font-size: 14px;
        color: #d4b5c0;
        padding: 4px 10px;
        cursor: pointer;
        transition: color 0.15s;
      }
      .item-remove:hover{
        color: #d86f98;
      }
      .playlist-footer{
        padding: 12px 20px 16px;
        border-top: 1px solid #ffe0e8;
      }
      .add-song-btn{
        width: 100%;
        padding: 10px;
        border: 1px dashed #f7aec4;
        background: transparent;
        color: #d86f98;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }
      .add-song-btn:hover{
        background: rgba(247, 174, 196, 0.1);
      }

      /*添加歌曲弹窗*/
      .add-song-modal{
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1100;
        display: none;
        align-items: center;
        justify-content: center;
      }
      .add-song-modal.show{
        display: flex;
      }
      .add-song-mask{
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
      }
      .add-song-content{
        position: relative;
        width: 85%;
        max-width: 360px;
        max-height: 60vh;
        background: #fff5f7;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        animation: popIn 0.25s ease;
      }
      @keyframes popIn{
        from{ transform: scale(0.9); opacity: 0; }
        to{ transform: scale(1); opacity: 1; }
      }
      .add-song-header{
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 18px;
        border-bottom: 1px solid #ffe0e8;
        font-size: 16px;
        font-weight: 700;
        color: #d86f98;
      }
      .add-song-close{
        font-size: 16px;
        color: #c59aa9;
        cursor: pointer;
        padding: 4px 8px;
      }
      .add-song-list{
        flex: 1;
        overflow-y: auto;
        padding: 8px 0;
      }
      .add-song-item{
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 18px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .add-song-item:hover{
        background: rgba(247, 174, 196, 0.15);
      }
      .add-song-item.disabled{
        opacity: 0.4;
        cursor: not-allowed;
      }
      .add-item-name{
        font-size: 14px;
        color: #7a5c68;
      }
      .add-item-status{
        font-size: 12px;
        color: #d86f98;
        font-weight: 600;
      }
      .add-song-item.disabled .add-item-status{
        color: #c59aa9;
      }
    </style>
  </head>

  <body>

  <!--背景-->

  <div class="floating f1">❤</div>
  <div class="floating f2">✨</div>
  <div class="floating f3">💌</div>
  <div class="floating f4">💕</div>
  <div class="floating f5">💗</div>
  <div class="floating f6">🌸</div>
  <div class="floating f7">💖</div>
  <div class="floating f8">🎀</div>
  <div class="floating f9">💝</div>
  <div class="floating f10">🦋</div>
  <div class="floating f11">🌷</div>
  <div class="floating f12">💞</div>
  <div class="floating f13">🩷</div>
  <div class="floating f14">🍓</div>
  <div class="floating f15">🧁</div>
  <div class="floating f16">💮</div>

  <!--第一页-->

  <div class="page active" id="page1">
    <div class="capsule">
      <div class="small-heart">૮ต•̤ ༝ •̤ตა</div>

      <h1>
        surprise❤
      </h1>

      <P>
        亲爱的宝宝<br>
        感到幸福的瞬间是你在身边<br>
        希望我的声音可以一直陪伴你
      </P>

      <button class="open-button" onclick="openMemory()">
        打开♡
      </button>
    </div>
  </div>

  <!--第二页-->
  <div
    class="page" id="page2">
  <div class="memory-card">
    <div class="top-decoration">
     左众
    </div>

    <h2>
      ZZ&HLM
    </h2>

    <P class="memory-text">
      如果你现在在听<br>
      那么这一刻 我爱你
    </P>


    <!--唱片-->
    <div class="song-name" id="songName">
      记得想我
    </div>
    <div class="record-wrapper" id="recordWrapper">
      <div class="record" id="record">
      </div>
    </div>

    <!--播放按键-->
    <button class="play-button"id="playButton">
     qwq
    </button>

    <!--播放列表入口栏-->
    <div class="playlist-bar" id="playlistBar">
      <span class="playlist-bar-icon">☰</span>
      <span class="playlist-bar-title">播放列表</span>
      <span class="playlist-bar-count" id="playlistCount">5首</span>
      <span class="playlist-bar-mode" id="playlistModeIcon">顺序</span>
    </div>

    <!--进度条-->
    <div class="progress-container"id="progressContainer">
      <div class="progress"id="progress">
      </div>
    </div>

    <!--时间-->
    <div class="time">
      <span id="currentTime">
        0:00
      </span>
      <span id="duration">
        0:00
      </span>
    </div>

    <div class="date">
      生日快乐
    </div>

    <button class="nfc-button" onclick="writeNFC()">
      写入 NFC 卡片
    </button>

    <!--播放列表面板-->
    <div class="playlist-panel" id="playlistPanel">
      <div class="playlist-mask" id="playlistMask"></div>
      <div class="playlist-content">
        <div class="playlist-header">
          <span class="playlist-title">播放列表</span>
          <span class="playlist-close" id="playlistClose">✕</span>
        </div>
        <div class="playlist-modes">
          <button class="mode-btn active" data-mode="order">
            <span class="mode-icon">☰</span><span class="mode-text">顺序</span>
          </button>
          <button class="mode-btn" data-mode="repeat-list">
            <span class="mode-icon">🔁</span><span class="mode-text">列表循环</span>
          </button>
          <button class="mode-btn" data-mode="repeat-one">
            <span class="mode-icon">🔂</span><span class="mode-text">单曲</span>
          </button>
          <button class="mode-btn" data-mode="shuffle">
            <span class="mode-icon">🔀</span><span class="mode-text">随机</span>
          </button>
        </div>
        <div class="playlist-items" id="playlistItems"></div>
        <div class="playlist-footer">
          <button class="add-song-btn" id="addSongBtn">+ 添加歌曲</button>
        </div>
      </div>
    </div>

    <!--添加歌曲弹窗-->
    <div class="add-song-modal" id="addSongModal">
      <div class="add-song-mask" id="addSongMask"></div>
      <div class="add-song-content">
        <div class="add-song-header">
          <span>添加歌曲</span>
          <span class="add-song-close" id="addSongClose">✕</span>
        </div>
        <div class="add-song-list" id="addSongList"></div>
      </div>
    </div>
  </div>

  <!--音频-->
  <audio
    id="audio" src="voice1.mp3">
  </audio>

  <script>
    const audio = document .getElementById("audio");
    const playButton=document .getElementById("playButton");
    const record=document .getElementById("record");
    const progress=document .getElementById("progress");
    const progressContainer=document .getElementById("progressContainer");
    const currenTime=document .getElementById("currentTime");
    const duration=document.getElementById("duration");
    const songName=document.getElementById("songName");

    /*唱片滑动切音频*/
    const recordWrapper = document.getElementById("recordWrapper");
    /*所有歌曲库*/
    const allSongs = [
      {src: "voice1.mp3", name: "记得想我"},
      {src: "voice2.m4a", name: "我爱你"},
      {src: "voice.mp3", name: "几分之几"},
      {src: "voice3.mp3", name: "爱，很简单"},
      {src: "voice4.mp3", name: "我不难过"}
    ];
    /*播放列表（存储 allSongs 的索引，默认全部）*/
    let playlist = [0, 1, 2, 3, 4];
    /*播放模式: order顺序 / repeat-list列表循环 / repeat-one单曲 / shuffle随机*/
    let playMode = "order";
    /*当前播放列表中的位置*/
    let currentPlaylistIndex = 0;
    let swipeStartX = 0;
    let swipeCurrentX = 0;
    let isSwiping = false;
    const SWIPE_THRESHOLD = 60;
    let maxSwipeDistance = 80;

    function calcSwipeBoundary() {
      var card = document.querySelector(".memory-card");
      var wrapper = document.getElementById("recordWrapper");
      if (!card || !wrapper) return 80;
      var cardRect = card.getBoundingClientRect();
      var wrapperRect = wrapper.getBoundingClientRect();
      var maxDist = (cardRect.width - wrapperRect.width) / 2;
      return Math.max(20, maxDist);
    }

    function getSwipeX(e) {
      return e.touches ? e.touches[0].clientX : e.clientX;
    }

    function getCurrentSong() {
      return allSongs[playlist[currentPlaylistIndex]];
    }

    function switchAudio(pIndex) {
      if (playlist.length === 0) return;
      if (pIndex < 0) pIndex = playlist.length - 1;
      if (pIndex >= playlist.length) pIndex = 0;
      currentPlaylistIndex = pIndex;
      const song = getCurrentSong();
      audio.pause();
      audio.src = song.src;
      audio.load();
      audio.play().catch(function(){});
      playButton.innerHTML = "Ⅱ";
      record.classList.add("spinning");
      progress.style.width = "0%";
      currenTime.innerHTML = "0:00";
      songName.style.opacity = "0";
      setTimeout(function(){
        songName.innerHTML = song.name;
        songName.style.opacity = "0.92";
      }, 200);
      renderPlaylist();
    }

    function handleSwipeEnd(deltaX) {
      recordWrapper.style.transition = "transform 0.3s ease";
      if (Math.abs(deltaX) < SWIPE_THRESHOLD) {
        recordWrapper.style.transform = "translateX(0)";
        return;
      }
      if (playlist.length === 0) {
        recordWrapper.style.transform = "translateX(0)";
        return;
      }
      if (deltaX < 0) {
        switchAudio(currentPlaylistIndex + 1);
      } else {
        switchAudio(currentPlaylistIndex - 1);
      }
      recordWrapper.style.transform = "translateX(0)";
    }

    recordWrapper.addEventListener("touchstart", function(e) {
      swipeStartX = getSwipeX(e);
      isSwiping = true;
      maxSwipeDistance = calcSwipeBoundary();
      recordWrapper.style.transition = "none";
    }, { passive: true });
    recordWrapper.addEventListener("touchmove", function(e) {
      if (!isSwiping) return;
      e.preventDefault();
      var delta = getSwipeX(e) - swipeStartX;
      swipeCurrentX = Math.max(-maxSwipeDistance, Math.min(maxSwipeDistance, delta));
      recordWrapper.style.transform = "translateX(" + swipeCurrentX + "px)";
    }, { passive: false });
    recordWrapper.addEventListener("touchend", function() {
      if (!isSwiping) return;
      isSwiping = false;
      handleSwipeEnd(swipeCurrentX);
      swipeCurrentX = 0;
    });

    recordWrapper.addEventListener("mousedown", function(e) {
      swipeStartX = getSwipeX(e);
      isSwiping = true;
      maxSwipeDistance = calcSwipeBoundary();
      recordWrapper.style.transition = "none";
      e.preventDefault();
    });
    document.addEventListener("mousemove", function(e) {
      if (!isSwiping) return;
      var delta = getSwipeX(e) - swipeStartX;
      swipeCurrentX = Math.max(-maxSwipeDistance, Math.min(maxSwipeDistance, delta));
      recordWrapper.style.transform = "translateX(" + swipeCurrentX + "px)";
    });
    document.addEventListener("mouseup", function() {
      if (!isSwiping) return;
      isSwiping = false;
      handleSwipeEnd(swipeCurrentX);
      swipeCurrentX = 0;
    });

    /*打开纪念页面*/
    function  openMemory(){
      document .getElementById("page1") .classList .remove("active");
      document .getElementById("page2") .classList .add("active");
    }

    /*播放 暂停*/

    playButton .addEventListener("click",()=> {
      if (
              audio.paused
      ) {
        audio.play();
        playButton.innerHTML = "Ⅱ";
        record.classList.add("spinning");
      } else {
        audio.pause();
        playButton.innerHTML = "qwq";
        record.classList.remove("spinning");
      }
    }
    );

    /*更新进度*/
    audio.addEventListener("timeupdate",
            ()=>{
      const percentage = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      progress.style.width = percentage + "%";
      currenTime .innerHTML=formatTime(
              audio.currentTime
      );
            }
    );

/*音频总长度*/
    audio.addEventListener("loadedmetadata",()=>{
      duration.innerHTML=formatTime(
              audio.duration
      );
    }
    )
    /*点击进度条跳转*/
    progressContainer.addEventListener(
            "click",(e)=>{
              const width=progressContainer.clientWidth;
              const clickX=e.offsetX;
              audio.currentTime=(
                      clickX/width
              )
              * audio.duration;
            }
    );

    /*播放结束 - 根据播放模式自动处理*/
    audio.addEventListener("ended",()=>{
      if (playlist.length === 0) {
        playButton.innerHTML="qwq";
        record.classList.remove("spinning");
        return;
      }
      if (playMode === "repeat-one") {
        /*单曲循环：重播当前*/
        audio.currentTime = 0;
        audio.play();
        return;
      }
      if (playMode === "shuffle") {
        /*随机播放：随机选一首（不与当前相同）*/
        if (playlist.length <= 1) {
          audio.currentTime = 0;
          audio.play();
          return;
        }
        let next;
        do {
          next = Math.floor(Math.random() * playlist.length);
        } while (next === currentPlaylistIndex);
        switchAudio(next);
        return;
      }
      /*顺序播放 / 列表循环*/
      if (currentPlaylistIndex < playlist.length - 1) {
        switchAudio(currentPlaylistIndex + 1);
      } else if (playMode === "repeat-list") {
        /*列表循环：回到第一首*/
        switchAudio(0);
      } else {
        /*顺序播放：播完停止*/
        playButton.innerHTML="qwq";
        record.classList.remove("spinning");
      }
    });

    /*时间格式*/
    function formatTime(seconds){
      if (
              isNaN(seconds)
      ){
        return "00:00";
      }
      const minutes= Math.floor(seconds/60);
      const remainingSeconds=Math.floor(seconds % 60);
      return minutes + ":" + remainingSeconds.toString().padStart(2,"0");
    }

    /*写入NFC卡片*/
    async function writeNFC() {
      const btn = document.querySelector(".nfc-button");
      if (!("NDEFReader" in window)) {
        alert("当前浏览器不支持 NFC 写入。\n\n请用安卓手机的 Chrome 或 Edge 浏览器打开此页面，\n不支持微信、QQ、夸克、UC 等浏览器。");
        return;
      }
      try {
        btn.textContent = "正在写入，请将卡片贴近手机…";
        btn.disabled = true;
        const ndef = new NDEFReader();
        await ndef.write({
          records: [{
            recordType: "url",
            data: window.location.href
          }]
        });
        alert("写入成功！现在用手机碰这张卡片就能打开这个页面啦");
      } catch (err) {
        let msg = err.message || String(err);
        if (err.name === "NotAllowedError") {
          msg = "NFC 权限被拒绝，请在浏览器设置中允许使用 NFC";
        } else if (err.name === "NotFoundError") {
          msg = "没有检测到 NFC 卡片，请将卡片贴近手机背面顶部再试";
        }
        alert("写入失败：" + msg + "\n\n请检查：\n1. 手机设置里已开启 NFC\n2. 卡片贴近手机背面顶部（摄像头附近）\n3. 卡片是空白或可复写的 NDEF 卡（部分门禁卡不支持）");
      } finally {
        btn.textContent = "写入 NFC 卡片";
        btn.disabled = false;
      }
    }

    /*========== 播放列表功能 ==========*/
    const playlistPanel = document.getElementById("playlistPanel");
    const playlistBar = document.getElementById("playlistBar");
    const playlistClose = document.getElementById("playlistClose");
    const playlistMask = document.getElementById("playlistMask");
    const playlistItems = document.getElementById("playlistItems");
    const playlistCount = document.getElementById("playlistCount");
    const playlistModeIcon = document.getElementById("playlistModeIcon");
    const addSongBtn = document.getElementById("addSongBtn");
    const addSongModal = document.getElementById("addSongModal");
    const addSongClose = document.getElementById("addSongClose");
    const addSongMask = document.getElementById("addSongMask");
    const addSongList = document.getElementById("addSongList");

    const modeLabels = {
      "order": "顺序",
      "repeat-list": "列表循环",
      "repeat-one": "单曲",
      "shuffle": "随机"
    };

    /*渲染播放列表*/
    function renderPlaylist() {
      playlistItems.innerHTML = "";
      playlist.forEach(function(songIdx, pIdx) {
        const song = allSongs[songIdx];
        const item = document.createElement("div");
        item.className = "playlist-item" + (pIdx === currentPlaylistIndex ? " playing" : "");
        item.innerHTML =
          '<span class="item-index">' + (pIdx === currentPlaylistIndex ? "♪" : (pIdx + 1)) + '</span>' +
          '<span class="item-name">' + song.name + '</span>' +
          '<span class="item-remove" data-pidx="' + pIdx + '">✕</span>';
        item.addEventListener("click", function(e) {
          if (e.target.classList.contains("item-remove")) return;
          switchAudio(pIdx);
        });
        playlistItems.appendChild(item);
      });
      /*绑定删除按钮*/
      playlistItems.querySelectorAll(".item-remove").forEach(function(btn) {
        btn.addEventListener("click", function(e) {
          e.stopPropagation();
          removeFromPlaylist(parseInt(this.dataset.pidx));
        });
      });
      playlistCount.textContent = playlist.length + "首";
    }

    /*从播放列表删除*/
    function removeFromPlaylist(pIdx) {
      if (playlist.length <= 1) {
        alert("播放列表至少要保留一首歌曲哦");
        return;
      }
      playlist.splice(pIdx, 1);
      if (pIdx < currentPlaylistIndex) {
        currentPlaylistIndex--;
      } else if (pIdx === currentPlaylistIndex) {
        if (currentPlaylistIndex >= playlist.length) {
          currentPlaylistIndex = 0;
        }
        switchAudio(currentPlaylistIndex);
      }
      renderPlaylist();
      renderAddSongList();
    }

    /*渲染添加歌曲列表*/
    function renderAddSongList() {
      addSongList.innerHTML = "";
      allSongs.forEach(function(song, idx) {
        const inPlaylist = playlist.indexOf(idx) !== -1;
        const item = document.createElement("div");
        item.className = "add-song-item" + (inPlaylist ? " disabled" : "");
        item.innerHTML =
          '<span class="add-item-name">' + song.name + '</span>' +
          '<span class="add-item-status">' + (inPlaylist ? "已在列表" : "+ 添加") + '</span>';
        if (!inPlaylist) {
          item.addEventListener("click", function() {
            playlist.push(idx);
            renderPlaylist();
            renderAddSongList();
          });
        }
        addSongList.appendChild(item);
      });
    }

    /*更新入口栏模式显示*/
    function updateModeIcon() {
      playlistModeIcon.textContent = modeLabels[playMode];
    }

    /*面板开关*/
    function openPlaylist() {
      playlistPanel.classList.add("show");
      renderPlaylist();
    }
    function closePlaylist() {
      playlistPanel.classList.remove("show");
    }
    playlistBar.addEventListener("click", openPlaylist);
    playlistClose.addEventListener("click", closePlaylist);
    playlistMask.addEventListener("click", closePlaylist);

    /*模式切换*/
    document.querySelectorAll(".mode-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        document.querySelectorAll(".mode-btn").forEach(function(b) {
          b.classList.remove("active");
        });
        this.classList.add("active");
        playMode = this.dataset.mode;
        updateModeIcon();
      });
    });

    /*添加歌曲弹窗*/
    addSongBtn.addEventListener("click", function() {
      renderAddSongList();
      addSongModal.classList.add("show");
    });
    function closeAddSong() {
      addSongModal.classList.remove("show");
    }
    addSongClose.addEventListener("click", closeAddSong);
    addSongMask.addEventListener("click", closeAddSong);

    /*初始化渲染*/
    renderPlaylist();
    renderAddSongList();
    updateModeIcon();

  </script>
  </body>
</html>
